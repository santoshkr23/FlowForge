# Nginx site for FlowForge. Copy to /etc/nginx/sites-available/flowforge, set server_name, then:
#   sudo ln -s /etc/nginx/sites-available/flowforge /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d flowforge.example.com      # free HTTPS certificate
server {
    listen 80;
    server_name flowforge.example.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;   # stream MCP / long responses
    }
}
